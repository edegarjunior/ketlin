<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Ketlin ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff2a6d;
      --secondary: #ff758f;
      --gold: #ffd166;
      --bg-dark: #0b0314;
      --bg-mid: #1f0826;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, var(--bg-mid) 0%, var(--bg-dark) 100%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Canvas de Fundo (Partículas e Corações) */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    /* ================= TELA DE ABERTURA ================= */
    #intro-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #2b0938 0%, #09010f 100%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease, transform 1s ease;
      text-align: center;
      padding: 20px;
    }

    #intro-screen.hidden {
      opacity: 0;
      transform: scale(1.3);
      pointer-events: none;
    }

    .heart-btn {
      font-size: 5.5rem;
      cursor: pointer;
      filter: drop-shadow(0 0 25px var(--primary));
      animation: heartbeat 1.3s infinite;
      transition: transform 0.3s ease;
      margin-bottom: 20px;
    }

    .heart-btn:hover {
      transform: scale(1.15);
    }

    .intro-title {
      font-family: 'Dancing Script', cursive;
      font-size: 3.5rem;
      background: linear-gradient(45deg, #fff, var(--secondary), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .intro-sub {
      color: rgba(255, 255, 255, 0.75);
      font-size: 1rem;
      letter-spacing: 1px;
      animation: fadePulse 2s infinite;
    }

    /* ================= CONTEÚDO PRINCIPAL ================= */
    main {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 15px 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      color: #fff;
      text-shadow: 0 0 20px var(--primary), 0 0 40px var(--primary);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      color: #ffd6e0;
      font-weight: 300;
    }

    /* Botões de Modo de Visualização */
    .mode-switcher {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 20px 0 30px;
      background: var(--glass);
      padding: 8px;
      border-radius: 50px;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .mode-btn.active {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      box-shadow: 0 0 18px rgba(255, 42, 109, 0.6);
      font-weight: 600;
    }

    /* ================= MODO 1: CARROSSEL 3D ================= */
    #view-carousel {
      width: 100%;
      height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      overflow: visible;
      margin: 20px 0 40px;
      cursor: grab;
    }

    #view-carousel:active {
      cursor: grabbing;
    }

    .carousel-ring {
      width: 190px;
      height: 260px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s linear;
    }

    .carousel-item {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 18px rgba(255, 42, 109, 0.45);
      background: #000;
      transition: box-shadow 0.3s, border-color 0.3s;
      cursor: pointer;
      -webkit-box-reflect: below 12px linear-gradient(transparent 65%, rgba(255, 255, 255, 0.2));
    }

    .carousel-item:hover {
      border-color: var(--gold);
      box-shadow: 0 0 30px var(--primary), 0 0 50px var(--gold);
    }

    .carousel-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .hint-text {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: -10px;
      margin-bottom: 25px;
      text-align: center;
    }

    /* ================= MODO 2: MURAL POLAROID ================= */
    #view-polaroid {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 28px;
      width: 100%;
      padding: 20px 10px;
    }

    .polaroid-card {
      background: #fff;
      padding: 12px 12px 26px 12px;
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(255, 42, 109, 0.25);
      transform: rotate(var(--rot));
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      animation: floatCard 4s ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    .polaroid-card:hover {
      transform: scale(1.08) rotate(0deg) translateY(-10px) !important;
      box-shadow: 0 20px 40px rgba(255, 42, 109, 0.6);
      z-index: 10;
    }

    .polaroid-card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .polaroid-caption {
      font-family: 'Dancing Script', cursive;
      color: #2b0938;
      font-size: 1.45rem;
      text-align: center;
      font-weight: 700;
    }

    /* ================= MODO 3: BARALHO MÁGICO (DECK) ================= */
    #view-deck {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 450px;
      position: relative;
      margin: 10px 0 30px;
    }

    .deck-container {
      width: 280px;
      height: 380px;
      position: relative;
      perspective: 1000px;
    }

    .deck-card {
      position: absolute;
      inset: 0;
      background: #fff;
      padding: 10px 10px 45px 10px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.6s ease;
      display: flex;
      flex-direction: column;
    }

    .deck-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      pointer-events: none;
    }

    .deck-card span {
      font-family: 'Dancing Script', cursive;
      color: #2b0938;
      font-size: 1.4rem;
      text-align: center;
      margin-top: 8px;
      font-weight: 700;
    }

    .deck-card.fly-out {
      transform: translate(220px, -80px) rotate(28deg) scale(0.8) !important;
      opacity: 0;
      pointer-events: none;
    }

    /* ================= CARTA DE AMOR ================= */
    .love-letter {
      margin-top: 30px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      padding: 30px 25px;
      border-radius: 24px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 25px rgba(255, 42, 109, 0.2);
      text-align: center;
      position: relative;
    }

    .love-letter h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      color: var(--gold);
      margin-bottom: 15px;
    }

    #typewriter-text {
      font-size: 1.08rem;
      line-height: 1.8;
      color: #f8e8ee;
      min-height: 110px;
      white-space: pre-line;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      background-color: var(--primary);
      animation: blink 0.8s infinite;
      margin-left: 4px;
    }

    /* ================= BOTÃO CHUVA DE AMOR ================= */
    .love-burst-btn {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 90;
      background: linear-gradient(45deg, var(--primary), #ff758f);
      border: none;
      color: #fff;
      padding: 14px 22px;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 42, 109, 0.8);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s ease;
    }

    .love-burst-btn:hover {
      transform: scale(1.08);
    }

    .love-burst-btn:active {
      transform: scale(0.95);
    }

    /* ================= MODAL DE FOTO (LIGHTBOX) ================= */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(8, 2, 15, 0.9);
      backdrop-filter: blur(10px);
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #lightbox.open {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    #lightbox img {
      max-width: 92vw;
      max-height: 75vh;
      border-radius: 16px;
      border: 3px solid var(--gold);
      box-shadow: 0 0 40px rgba(255, 42, 109, 0.7);
      object-fit: contain;
    }

    #lightbox-caption {
      font-family: 'Dancing Script', cursive;
      font-size: 2.2rem;
      color: #fff;
      margin-top: 16px;
      text-shadow: 0 0 15px var(--primary);
      text-align: center;
    }

    .close-lightbox {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 2.5rem;
      color: #fff;
      cursor: pointer;
      line-height: 1;
    }

    /* Corações de rastro do mouse/toque */
    .trail-heart {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-size: 1.2rem;
      animation: floatUpOut 1s ease-out forwards;
    }

    /* ================= ANIMAÇÕES ================= */
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.22); }
      30% { transform: scale(0.95); }
      45% { transform: scale(1.15); }
    }

    @keyframes fadePulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @keyframes floatCard {
      0% { transform: translateY(0px) rotate(var(--rot)); }
      100% { transform: translateY(-10px) rotate(var(--rot)); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes floatUpOut {
      0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.6) rotate(25deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 650px) {
      .carousel-ring {
        width: 140px;
        height: 200px;
      }
      #view-carousel {
        height: 340px;
      }
    }
  </style>
</head>
<body>

  <!-- Canvas de Partículas e Corações -->
  <canvas id="bg-canvas"></canvas>

  <!-- Tela Inicial -->
  <div id="intro-screen" onclick="startExperience()">
    <div class="heart-btn">💖</div>
    <div class="intro-title">Para o Meu Amor</div>
    <div class="intro-sub">Toque no coração para abrir sua surpresa ✨</div>
  </div>

  <!-- Conteúdo Principal -->
  <main>
    <header>
      <h1>Nossos Momentos ❤️</h1>
      <p class="subtitle">Cada foto guarda um pedacinho da nossa história</p>
    </header>

    <!-- Seletor de Modo de Animação -->
    <div class="mode-switcher">
      <button class="mode-btn active" onclick="switchMode('carousel', this)">🎡 Carrossel 3D</button>
      <button class="mode-btn" onclick="switchMode('polaroid', this)">📸 Mural Polaroid</button>
      <button class="mode-btn" onclick="switchMode('deck', this)">🃏 Baralho Mágico</button>
    </div>

    <!-- MODO 1: Carrossel 3D -->
    <section id="view-carousel">
      <div class="carousel-ring" id="carousel-ring"></div>
    </section>
    <p class="hint-text" id="mode-hint">✨ Arraste para girar ou toque em uma foto para ampliar ✨</p>

    <!-- MODO 2: Mural Polaroid -->
    <section id="view-polaroid"></section>

    <!-- MODO 3: Baralho Interativo -->
    <section id="view-deck">
      <div class="deck-container" id="deck-container"></div>
    </section>

    <!-- Carta Romântica com Efeito Digitação -->
    <section class="love-letter">
      <h2>Para Você, Meu Amor ✨</h2>
      <p><span id="typewriter-text"></span><span class="cursor">&nbsp;</span></p>
    </section>
  </main>

  <!-- Botão Flutuante de Explosão de Corações -->
  <button class="love-burst-btn" onclick="triggerLoveExplosion()">
    💝 Chuva de Amor
  </button>

  <!-- Modal Lightbox -->
  <div id="lightbox" onclick="closeLightbox()">
    <span class="close-lightbox">&times;</span>
    <img id="lightbox-img" src="" alt="Nossa Foto" />
    <div id="lightbox-caption"></div>
  </div>

  <script>
    // Lista exata das 12 fotos do seu repositório com legendas românticas
    const photos = [
      { src: 'photo_1_2026-10-27_16-09-06.jpg', caption: 'Meu lugar favorito é ao seu lado ❤️' },
      { src: 'photo_2_2026-10-27_16-09-06.jpg', caption: 'Seu sorriso ilumina o meu mundo ✨' },
      { src: 'photo_3_2026-10-27_16-09-06.jpg', caption: 'Cada momento com você é único 🥰' },
      { src: 'photo_4_2026-10-27_16-09-06.jpg', caption: 'Minha melhor companhia de todas 💖' },
      { src: 'photo_5_2026-10-27_16-09-06.jpg', caption: 'Nosso amor é a minha maior sorte 🍀' },
      { src: 'photo_6_2026-10-27_16-09-06.jpg', caption: 'A dona do meu coração 💘' },
      { src: 'photo_7_2026-10-27_16-09-06.jpg', caption: 'Colecionando memórias incríveis com você 📸' },
      { src: 'photo_8_2026-10-27_16-09-06.jpg', caption: 'Com você tudo fica mais bonito 🌹' },
      { src: 'photo_9_2026-10-27_16-09-06.jpg', caption: 'Te amo mais a cada dia que passa ♾️' },
      { src: 'photo_10_2026-10-27_16-09-06.jpg', caption: 'Nossa sintonia é de outro mundo 💫' },
      { src: 'photo_11_2026-10-27_16-09-06.jpg', caption: 'Você faz meus dias muito mais felizes 😍' },
      { src: 'photo_12_2026-10-27_16-09-06.jpg', caption: 'Para sempre nós dois ❤️' }
    ];

    const loveMessage = `Olhar para cada uma dessas fotos me faz lembrar da sorte que eu tenho por dividir a vida com você.\n\nCada risada, cada abraço e cada instante ao seu lado se transforma na minha memória favorita. Obrigado por ser tão incrível, por trazer tanta luz para os meus dias e por construir essa história linda comigo.\n\nEu te amo demais! ❤️`;

    // ================= INICIALIZAR GALERIAS =================
    const ring = document.getElementById('carousel-ring');
    const polaroidGrid = document.getElementById('view-polaroid');
    const deckContainer = document.getElementById('deck-container');

    function getRadius() {
      return window.innerWidth < 650 ? 250 : 390;
    }

    function buildGalleries() {
      ring.innerHTML = '';
      polaroidGrid.innerHTML = '';
      deckContainer.innerHTML = '';

      const total = photos.length;
      const angleStep = 360 / total;
      const radius = getRadius();

      photos.forEach((item, index) => {
        // 1. Item do Carrossel 3D
        const cItem = document.createElement('div');
        cItem.className = 'carousel-item';
        cItem.style.transform = `rotateY(${index * angleStep}deg) translateZ(${radius}px)`;
        cItem.innerHTML = `<img src="${item.src}" alt="Foto ${index + 1}">`;
        cItem.onclick = () => openLightbox(item.src, item.caption);
        ring.appendChild(cItem);

        // 2. Item Polaroid
        const pCard = document.createElement('div');
        pCard.className = 'polaroid-card';
        const randomRot = (Math.random() * 8 - 4).toFixed(1) + 'deg';
        const randomDelay = (Math.random() * 2).toFixed(2) + 's';
        pCard.style.setProperty('--rot', randomRot);
        pCard.style.setProperty('--delay', randomDelay);
        pCard.innerHTML = `
          <img src="${item.src}" alt="Foto ${index + 1}">
          <div class="polaroid-caption">${item.caption}</div>
        `;
        pCard.onclick = () => openLightbox(item.src, item.caption);
        polaroidGrid.appendChild(pCard);
      });

      buildDeck();
    }

    function buildDeck() {
      deckContainer.innerHTML = '';
      // Insere do último para o primeiro para a foto 1 ficar no topo
      [...photos].reverse().forEach((item, revIndex) => {
        const card = document.createElement('div');
        card.className = 'deck-card';
        const offset = (photos.length - 1 - revIndex);
        const rot = (offset % 2 === 0 ? 1 : -1) * (offset * 1.2);
        card.style.transform = `translateY(${offset * 2}px) rotate(${rot}deg)`;
        card.innerHTML = `
          <img src="${item.src}" alt="Foto">
          <span>${item.caption}</span>
        `;
        card.onclick = () => {
          card.classList.add('fly-out');
          spawnBurst(window.innerWidth / 2, window.innerHeight / 2, 12);
          setTimeout(() => {
            const remaining = deckContainer.querySelectorAll('.deck-card:not(.fly-out)');
            if (remaining.length === 0) {
              buildDeck();
            }
          }, 600);
        };
        deckContainer.appendChild(card);
      });
    }

    buildGalleries();
    window.addEventListener('resize', buildGalleries);

    // ================= ROTAÇÃO DO CARROSSEL 3D =================
    let currentAngle = 0;
    let isDragging = false;
    let startX = 0;
    let autoRotate = true;

    function animateCarousel() {
      if (autoRotate && !isDragging) {
        currentAngle -= 0.22;
        ring.style.transform = `rotateX(-6deg) rotateY(${currentAngle}deg)`;
      }
      requestAnimationFrame(animateCarousel);
    }
    animateCarousel();

    const carouselSection = document.getElementById('view-carousel');
    carouselSection.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const delta = e.clientX - startX;
      currentAngle += delta * 0.35;
      ring.style.transform = `rotateX(-6deg) rotateY(${currentAngle}deg)`;
      startX = e.clientX;
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    carouselSection.addEventListener('touchstart', (e) => {
      isDragging = true;
      startX = e.touches[0].clientX;
    });
    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const delta = e.touches[0].clientX - startX;
      currentAngle += delta * 0.45;
      ring.style.transform = `rotateX(-6deg) rotateY(${currentAngle}deg)`;
      startX = e.touches[0].clientX;
    });
    window.addEventListener('touchend', () => { isDragging = false; });

    // ================= TROCA DE MODOS =================
    function switchMode(mode, btn) {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const cView = document.getElementById('view-carousel');
      const pView = document.getElementById('view-polaroid');
      const dView = document.getElementById('view-deck');
      const hint = document.getElementById('mode-hint');

      cView.style.display = 'none';
      pView.style.display = 'none';
      dView.style.display = 'none';

      if (mode === 'carousel') {
        cView.style.display = 'flex';
        autoRotate = true;
        hint.textContent = '✨ Arraste para girar ou toque em uma foto para ampliar ✨';
      } else if (mode === 'polaroid') {
        pView.style.display = 'grid';
        autoRotate = false;
        hint.textContent = '✨ Toque em qualquer Polaroid para ver em tela cheia ✨';
      } else if (mode === 'deck') {
        dView.style.display = 'flex';
        autoRotate = false;
        buildDeck();
        hint.textContent = '✨ Toque na foto do topo para passar para a próxima ✨';
      }
      triggerLoveExplosion(18);
    }

    // ================= TELA DE ABERTURA E MÁQUINA DE ESCREVER =================
    let typewriterStarted = false;

    function startExperience() {
      document.getElementById('intro-screen').classList.add('hidden');
      triggerLoveExplosion(45);
      if (!typewriterStarted) {
        typewriterStarted = true;
        setTimeout(runTypewriter, 900);
      }
    }

    function runTypewriter() {
      const el = document.getElementById('typewriter-text');
      let i = 0;
      function type() {
        if (i < loveMessage.length) {
          el.textContent += loveMessage.charAt(i);
          i++;
          setTimeout(type, 38);
        }
      }
      type();
    }

    // ================= LIGHTBOX =================
    function openLightbox(src, caption) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-caption').textContent = caption;
      document.getElementById('lightbox').classList.add('open');
      triggerLoveExplosion(20);
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    // ================= RASTRO DE CORAÇÕES E EXPLOSÕES =================
    const emojis = ['❤️', '💖', '💘', '✨', '🥰', '💕', '🌹'];

    function createTrailHeart(x, y) {
      const heart = document.createElement('div');
      heart.className = 'trail-heart';
      heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      heart.style.left = (x - 10) + 'px';
      heart.style.top = (y - 10) + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1000);
    }

    let lastTrail = 0;
    window.addEventListener('mousemove', (e) => {
      const now = Date.now();
      if (now - lastTrail > 90) {
        createTrailHeart(e.clientX, e.clientY);
        lastTrail = now;
      }
    });

    window.addEventListener('touchmove', (e) => {
      const now = Date.now();
      if (now - lastTrail > 90) {
        createTrailHeart(e.touches[0].clientX, e.touches[0].clientY);
        lastTrail = now;
      }
    });

    function spawnBurst(x, y, count = 25) {
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'trail-heart';
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        const angle = Math.random() * Math.PI * 2;
        const dist = 50 + Math.random() * 180;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;
        p.animate([
          { transform: 'translate(0, 0) scale(0.5)', opacity: 1 },
          { transform: `translate(${tx}px, ${ty}px) scale(1.6) rotate(${Math.random()*360}deg)`, opacity: 0 }
        ], {
          duration: 1000 + Math.random() * 600,
          easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
        });
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1600);
      }
    }

    function triggerLoveExplosion(amount = 35) {
      spawnBurst(window.innerWidth / 2, window.innerHeight / 2, amount);
    }

    // ================= CANVAS DE FUNDO (ESTRELAS E CORAÇÕES FLUTUANTES) =================
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    for (let i = 0; i < 65; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 3 + 1,
        speedY: Math.random() * 0.6 + 0.2,
        alpha: Math.random() * 0.8 + 0.2,
        isHeart: Math.random() > 0.75
      });
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.y -= p.speedY;
        if (p.y < -10) {
          p.y = canvas.height + 10;
          p.x = Math.random() * canvas.width;
        }
        ctx.save();
        ctx.globalAlpha = p.alpha;
        if (p.isHeart) {
          ctx.font = `${p.size * 5}px serif`;
          ctx.fillText('❤️', p.x, p.y);
        } else {
          ctx.fillStyle = '#ff9ebb';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });
      requestAnimationFrame(drawBackground);
    }
    drawBackground();
  </script>
</body>
</html>
